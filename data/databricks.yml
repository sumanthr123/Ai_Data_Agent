# Medallion layer behind the agent. A separate bundle: the root bundle holds the app, and a dev deploy of that needs an
# app slot this workspace doesn't have. `cd data && databricks bundle deploy -t dev` touches dev_* schemas only.
bundle:
  name: ai-data-agent-data

include:
  - resources/*.yml

variables:
  catalog:
    default: ai_data_agent
  prefix:
    description: Schema prefix the pipelines and jobs build names from, so dev never touches production schemas.
    default: ""
  trace_tables:
    description: Tables holding question text, as table:col+col,... Erased subjects are deleted from them.
    default: ${var.catalog}.${var.prefix}agent_ops.trace_log:question+answer
  app_principal:
    description: The app's service principal. The agent reads agent_gold; gold only so freshness can read Last Refreshed.
    default: e572c2cb-a6ae-4943-9419-68439ce6dda5
  alert_email:
    default: ${workspace.current_user.userName}

targets:
  dev:
    mode: development
    default: true
    variables:
      prefix: dev_${workspace.current_user.short_name}_  # the name development mode gives the schemas
  prod:
    mode: production
    variables:
      trace_tables: ${var.catalog}.user_uploads.review_queue:question+sql+detail,${var.catalog}.app_ops.question_log:question,${var.catalog}.app_ops.answer_feedback:question+answer
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    run_as:
      user_name: ${workspace.current_user.userName}
