<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AI Data Assistant</title>
    <script>
      // Before first paint, so the page never flashes the wrong theme. "system" (no entry) follows the OS.
      try { const t = localStorage.getItem('assistant.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) { console.warn('Theme preference unavailable', e) }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
